# Integrate this website against the real compiler, on every change.
#
# Nothing here builds Lean. The compiler arrives as a published image, which is the entire
# coupling between the two repos — so this job runs in a couple of minutes and needs no
# toolchain, no Mathlib, and no credentials (both repos are public).
#
# Two test layers, and the split is deliberate:
#
#   contract/check.py   what we depend on FROM the compiler. The compiler repo runs this
#                       same file against its freshly built binary before publishing, so if
#                       they break us they find out in their pipeline, not ours.
#   test/service.py     our own service behaving correctly. Only we run this.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # The compiler lives in another repo and publishing an image does not push anything here,
  # so nothing in *this* repo changes when it moves. We therefore pull rather than being
  # pushed to: no cross-repo trigger, no PAT, and the consumer keeps deciding when it takes a
  # new version. Daily, this run re-checks the contract against whatever `:latest` has become
  # — the integration canary — and redeploys only when the digest we are serving is no longer
  # the digest that exists.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPILER: ghcr.io/wegmanndavid/lambdalab-compiler:latest

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      # The exact compiler this run tested, so the deploy ships that one and can say what it
      # shipped. A tag is a moving target; resolving it once here means test and production
      # cannot end up looking at two different binaries.
      compiler: ${{ steps.compiler.outputs.digest }}

    steps:
      - uses: actions/checkout@v5

      # `:latest`, not a pinned digest, on purpose: this repo should go red when the
      # compiler's newest build stops satisfying the contract, because that is the signal
      # the whole two-repo arrangement exists to produce.
      - id: compiler
        name: Fetch the published compiler
        run: |
          docker pull "$COMPILER"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$COMPILER")
          echo "$COMPILER is $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          cid=$(docker create "$COMPILER")
          docker cp "$cid:/usr/local/bin/stlc" ./stlc
          docker rm "$cid"
          ls -lh ./stlc

      - name: Contract — what we depend on from the compiler
        run: python3 contract/check.py ./stlc

      - name: Build the image
        run: docker build --build-arg COMPILER="${{ steps.compiler.outputs.digest }}" -t lambdalab-web:ci .

      - name: Start it
        run: docker run -d --name web -p 8080:8080 lambdalab-web:ci

      - name: Wait for it to answer
        run: |
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8080/api/health >/dev/null && exit 0
            sleep 0.5
          done
          echo "service never became healthy" >&2
          exit 1

      - name: Service — our own behaviour, over HTTP
        run: python3 test/service.py http://127.0.0.1:8080

      # Without this, a failure above leaves you staring at a red X and no reason for it.
      - name: Container logs
        if: failure()
        run: docker logs web

  # Only after `test` is green, and only from main. A pull request builds and is tested; it
  # does not deploy.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write   # mint the OIDC token Google exchanges for a short-lived credential

    env:
      PROJECT: lambdalab-web
      REGION: europe-west3
      SERVICE: lambdalab-web

    steps:
      - uses: actions/checkout@v5

      # No service-account key exists, here or anywhere. GitHub signs a token asserting
      # which repo and ref is running; Google's workload identity pool is configured to
      # accept it only from this repository, and hands back a credential good for minutes.
      # Nothing long-lived is stored, so there is nothing to leak or rotate.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/713608289216/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@lambdalab-web.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # What is actually live. Every deploy stamps the compiler it shipped onto the service,
      # so this is a fact about production rather than a guess from tags or timestamps. Empty
      # on the first run after this landed, and on a service that does not exist yet — both
      # of which correctly read as "different", so the next deploy establishes the stamp.
      - id: live
        name: Which compiler production is serving
        run: |
          LIVE=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" \
                   --format=json 2>/dev/null \
                 | python3 -c 'import json,sys; c=json.load(sys.stdin)["spec"]["template"]["spec"]["containers"][0]; print(next((e.get("value","") for e in c.get("env",[]) if e.get("name")=="COMPILER_DIGEST"), ""))' \
                 || true)
          echo "live: ${LIVE:-<none>}"
          echo "digest=$LIVE" >> "$GITHUB_OUTPUT"

      # A scheduled run exists only to pick up a new compiler, so it does nothing when there
      # isn't one. Any other trigger is a change to this repo, which always ships.
      - id: decide
        name: Deploy, or not
        env:
          LIVE: ${{ steps.live.outputs.digest }}
          BUILT: ${{ needs.test.outputs.compiler }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            DEPLOY=true;  WHY="a change to this repo"
          elif [ "$LIVE" != "$BUILT" ]; then
            DEPLOY=true;  WHY="the compiler moved: ${LIVE:-<none>} -> $BUILT"
          else
            DEPLOY=false; WHY="already serving $BUILT"
          fi
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"
          echo "$WHY (deploy=$DEPLOY)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build and push to Artifact Registry
        if: steps.decide.outputs.deploy == 'true'
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/web/$SERVICE"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --build-arg COMPILER="${{ needs.test.outputs.compiler }}" \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
        # Cloud Run cannot pull from GHCR — Artifact Registry or nothing. The *compiler*
        # image still comes from GHCR, but that is a build-time base, resolved here on the
        # runner, not something Cloud Run ever sees.

      - name: Deploy to Cloud Run
        if: steps.decide.outputs.deploy == 'true'
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:${{ github.sha }}" \
            --update-env-vars "COMPILER_DIGEST=${{ needs.test.outputs.compiler }}" \
            --region "$REGION" \
            --project "$PROJECT" \
            --service-account lambdalab-run@lambdalab-web.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 --memory 512Mi \
            --concurrency 8 \
            --max-instances 3 \
            --timeout 30s \
            --quiet
        # concurrency 8, not the default 80: every request forks a compiler, and 80 of those
        # at once would exhaust the instance. max-instances 3 caps both the bill and the
        # blast radius of anyone who decides to hammer a public compile endpoint.
        #
        # The service runs as lambdalab-run, which holds no permissions whatsoever. It runs
        # arbitrary input from the internet; it should be able to reach nothing.

      - name: Report the URL
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" \
                  --project "$PROJECT" --format='value(status.url)')
          echo "$URL"
          echo "deployed: $URL" >> "$GITHUB_STEP_SUMMARY"

      # The image being good is not the same as the deployment being good. Same checks, real
      # URL, after the traffic switch — and unconditional, so a scheduled run that deploys
      # nothing still checks that production is alive.
      - name: Service checks against production
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" \
                  --project "$PROJECT" --format='value(status.url)')
          python3 test/service.py "$URL"
